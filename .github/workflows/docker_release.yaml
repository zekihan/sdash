name: Docker Build & Push

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  BUILDX_METADATA_PROVENANCE: "disabled"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Mask event email addresses
        run: |
          jq -r '.. | objects | .email? // empty | select(type == "string")' "$GITHUB_EVENT_PATH" |
            while IFS= read -r email; do
              printf '::add-mask::%s\n' "$email"
            done

      - name: Check Out The Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: build/node/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make build-essential
          sh .github/scripts/install_build_deps.sh
          ./build/bin/tailwindcss --input ./build/tailwind/input.css --output assets/css/tailwind.css

      - name: Make build
        run: |
          make build/release/docker

      - name: Prepare production CSS using locked tools
        run: make build/assets

      - name: Bundle prepared image inputs
        run: tar -czf image-inputs.tar.gz Dockerfile .dockerignore VERSION dist assets

      - name: Preserve image inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-inputs-${{ github.sha }}
          path: image-inputs.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download this run's prepared image inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-inputs-${{ github.sha }}

      - name: Extract prepared image inputs
        run: tar -xzf image-inputs.tar.gz

      - name: Set up params
        id: setup_builder
        run: |
          vers=$(tr -d '[:space:]' <VERSION)
          echo "version=$vers" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            docker.io/${{ secrets.DOCKER_USERNAME }}/${{ github.event.repository.name }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{version}}-${{github.run_number}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=${{ steps.setup_builder.outputs.version }}
            type=semver,pattern=v{{major}},value=${{ steps.setup_builder.outputs.version }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          logout: true

      - name: Login to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
