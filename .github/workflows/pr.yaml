name: PR Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

  workflow_call:
    inputs:
      publishing:
        description: Run container and release validation before publication
        type: boolean
        default: false
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: zekihan/release-workflows/.github/workflows/go-checks.yaml@98a85ab2b0ae4dd702aa142b1369277404f124df # main
    with:
      node-version: '26.x'
      node-cache-dependency-path: web/package-lock.json
      prepare-command: |
        sudo apt-get update -qq
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make build-essential
        sh .github/scripts/install_build_deps.sh
        npm --prefix web run build

  pr:
    needs: checks
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.checks.result }}" = success
