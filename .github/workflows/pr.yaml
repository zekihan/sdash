name: PR Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

  workflow_call:
    inputs:
      publishing:
        description: Run container and release validation before publication
        type: boolean
        default: false
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: build/node/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          install-only: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make build-essential
          sh .github/scripts/install_build_deps.sh
          ./build/bin/tailwindcss --input ./build/tailwind/input.css --output assets/css/tailwind.css

      - name: Build supply-chain regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Tidy
        run: |
          make tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a

      - name: Lint
        run: |
          make lint

      - name: Fail if there are any changes
        run: |
          git diff --exit-code

      - name: Test
        run: |
          make test

      - name: Build
        run: |
          goreleaser build --clean --snapshot --single-target --id all --skip=before
