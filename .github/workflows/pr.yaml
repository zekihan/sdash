name: PR Workflow

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out The Repo
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: build/node/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          install-only: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends make build-essential
          sh .github/scripts/install_build_deps.sh
          ./build/bin/tailwindcss --input ./build/tailwind/input.css --output assets/css/tailwind.css

      - name: Build supply-chain regression tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Tidy
        run: |
          make tidy

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0

      - name: Lint
        run: |
          make lint

      - name: Fail if there are any changes
        run: |
          git diff --exit-code

      - name: Test
        run: |
          make test

      - name: Build
        run: |
          make build/release/all
